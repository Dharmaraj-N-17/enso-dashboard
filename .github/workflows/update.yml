name: Update ENSO forecast
on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:       # lets you run it manually
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_forecast.py
      - name: Commit if changed
        run: |
          git config user.name "enso-bot"
          git config user.email "enso-bot@users.noreply.github.com"
          git add docs/forecast.json
          git diff --staged --quiet || (git commit -m "Update forecast" && git push)
